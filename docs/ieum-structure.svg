<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#fff"/>

  <g stroke="#111" stroke-width="2" fill="none">
    <!-- row1: 기관 → 포털 ← 전문가 -->
    <path d="M240,100 H316" marker-end="url(#a)"/>
    <path d="M600,100 H524" marker-end="url(#a)"/>
    <!-- 포털 → 서버 -->
    <path d="M420,140 V196" marker-end="url(#a)"/>
    <!-- 서버 → R2 / Supabase -->
    <path d="M320,240 H244" marker-end="url(#a)"/>
    <path d="M520,240 H596" marker-end="url(#a)"/>
    <!-- 서버 → 사무국 -->
    <path d="M420,280 V336" marker-end="url(#a)"/>
    <!-- Sentry → 사무국 -->
    <path d="M600,380 H524" marker-end="url(#a)"/>
    <!-- 사무국 → 개선 목록 -->
    <path d="M320,380 H244" marker-end="url(#a)"/>
    <!-- 개선 목록 → 터미널 -->
    <path d="M140,420 V520 H316" marker-end="url(#a)"/>
    <!-- 터미널 → GitHub -->
    <path d="M520,520 H596" marker-end="url(#a)"/>
  </g>
  <!-- 배포 피드백 (점선) -->
  <path d="M800,520 H845 V30 H420 V56" stroke="#111" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>

  <g font-size="12" fill="#111" font-weight="600">
