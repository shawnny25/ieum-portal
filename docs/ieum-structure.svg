    <rect x="320" y="60" width="200" height="80" fill="#fff"/>
    <rect x="600" y="60" width="200" height="80" fill="#fff"/>
    <rect x="40" y="200" width="200" height="80" fill="#F0F0F0" stroke="#bbb"/>
    <rect x="320" y="200" width="200" height="80" fill="#E9EC4A"/>
    <rect x="600" y="200" width="200" height="80" fill="#F0F0F0" stroke="#bbb"/>
    <rect x="40" y="340" width="200" height="80" fill="#fff"/>
    <rect x="320" y="340" width="200" height="80" fill="#E9EC4A"/>
    <rect x="600" y="340" width="200" height="80" fill="#F0F0F0" stroke="#bbb"/>
